services:
  app:
    build:
      context: .
    container_name: supermarket-pos
    ports:
      - "3000:3000"
    env_file:
      - .env.store
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ABO_ENV: store
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "3000"
      TZ: Asia/Hebron
      DATABASE_PATH: /app/data/supermarket.db
      BACKUP_DIR: /app/backups
      RECEIPT_PRINT_AGENT_URL: ${RECEIPT_PRINT_AGENT_URL:-http://host.docker.internal:17891}
      # Compose ${} substitution is not inside the container unless listed here.
      # start-store.ps1 passes --env-file .env.store so these match that file.
      TELEGRAM_APPROVALS_BOT_TOKEN: ${TELEGRAM_APPROVALS_BOT_TOKEN:-}
      TELEGRAM_APPROVALS_CHAT_ID: ${TELEGRAM_APPROVALS_CHAT_ID:-}
      TELEGRAM_APPROVALS_WEBHOOK_SECRET: ${TELEGRAM_APPROVALS_WEBHOOK_SECRET:-}
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    restart: unless-stopped
